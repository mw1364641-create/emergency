<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة طوارئ نظام NAR</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #161b22;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #30363d;
            background: #21262d;
            color: #fff;
            font-size: 16px;
        }
        button {
            background: #238636;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #2ea043;
        }
        #networkFeed {
            text-align: right;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            background: #0b0f19;
            padding: 10px;
            border-radius: 5px;
        }
        .msg-item {
            background: #21262d;
            margin: 8px 0;
            padding: 10px;
            border-right: 4px solid #58a6ff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚨 محطة طوارئ نظام NAR 🚨</h2>
        <p>نظام الاتصال والتعقب الميداني المباشر</p>

        <input type="text" id="senderName" placeholder="اسم المرسل / المحطة" value="محطة الميدان">
        <input type="text" id="msgText" placeholder="اكتب رسالة الطوارئ هنا...">
        <button onclick="handleSendClick()">إرسال فوري للسحاب 📡</button>

        <h3>سجل الرسائل الواردة:</h3>
        <div id="networkFeed">
            <div class="msg-item">النظام جاهز وفي انتظار الإشارات...</div>
        </div>
    </div>

    <!-- كود الاتصال بـ Supabase وربط الإرسال والاستقبال الفوري -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://typtskmgjjajvwlxzxyd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_f-miTVH0coVNguJAg_PTzQ_pTaA1RmX';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // دالة عرض الرسائل على الشاشة
        window.appendMessageToFeed = function(pkt, isSelf) {
            let feed = document.getElementById('networkFeed');
            if (feed.innerText.includes("النظام جاهز")) {
                feed.innerHTML = "";
            }
            let item = document.createElement('div');
            item.className = 'msg-item';
            item.innerHTML = `
                <strong>${isSelf ? '📤 (أرسلت)' : '📥 (استقبال من جهاز مجاور)'}</strong><br>
                <strong>المرسل:</strong> ${pkt.sender || 'مجهول'}<br>
                <strong>النص:</strong> ${pkt.text}<br>
                <span style="color:#8b949e; font-size: 12px;">⏰ ${new Date(pkt.created_at || Date.now()).toLocaleTimeString()}</span>
            `;
            feed.prepend(item);
        };

        // دالة الإرسال عند الضغط على الزر
        window.handleSendClick = async function() {
            let name = document.getElementById('senderName').value;
            let text = document.getElementById('msgText').value;
            if (!text.trim()) return;

            const { data, error } = await supabase
                .from('nar_messages')
                .insert([
                    { sender: name, text: text, morse: '--- ... ---' }
                ]);

            if (error) {
                alert('خطأ في الإرسال: ' + error.message);
            } else {
                document.getElementById('msgText').value = ""; // تفريغ حقل النص
            }
        };

        // الاستماع الفوري للرسائل الجديدة (Realtime)
        supabase
          .channel('public:nar_messages')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'nar_messages' }, payload => {
            console.log('رسالة جديدة وصلت:', payload.new);
            appendMessageToFeed(payload.new, false);
          })
          .subscribe();
    </script>
</body>
</html>
